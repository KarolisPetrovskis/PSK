<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Client Trainers (MyBatis)</title>
</h:head>
<h:body>
    <h1>Trainers for #{clientTrainersMyBatis.client.name}</h1>

    <!-- Form for adding a trainer -->
    <h:form>
        <!-- Preserve clientId across POST -->
        <input type="hidden" name="clientId" value="#{param.clientId}" />

        <h2>Add Trainer</h2>
        <h:panelGrid columns="2">
            <h:outputLabel value="Select Trainer:"/>
            <h:selectOneMenu value="#{clientTrainersMyBatis.trainerIdToAdd}" required="true">
                <f:selectItem itemLabel="-- Choose Trainer --" itemValue=""/>
                <f:selectItems value="#{clientTrainersMyBatis.allTrainers}" var="trainer"
                               itemLabel="#{trainer.name} (ID: #{trainer.id})"
                               itemValue="#{trainer.id}"/>
            </h:selectOneMenu>
        </h:panelGrid>
        <h:commandButton value="Add Trainer" action="#{clientTrainersMyBatis.addTrainerToClient}"/>
    </h:form>

    <h2>Current Trainers</h2>
    <h:dataTable value="#{clientTrainersMyBatis.client.trainers}" var="trainer" border="1"
                 rendered="#{not empty clientTrainersMyBatis.client.trainers}">
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{trainer.id}
        </h:column>
        <h:column>
            <f:facet name="header">Name</f:facet>
            #{trainer.name}
        </h:column>
        <h:column>
            <!-- Each remove button needs its own form with hidden clientId -->
            <h:form>
                <input type="hidden" name="clientId" value="#{param.clientId}" />
                <h:commandButton value="Remove" action="#{clientTrainersMyBatis.removeTrainerFromClient(trainer.id)}"/>
            </h:form>
        </h:column>
    </h:dataTable>

    <br/>
    <h:link value="Back to Clients (MyBatis)" outcome="/mybatis/clients"/>
</h:body>
</html>
