<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Clients</title>
</h:head>
<h:body>
    <h1>Clients</h1>

    <h:form>
        <h2>Create New Client</h2>
        <h:panelGrid columns="2">
            <h:outputLabel value="Name:"/>
            <h:inputText value="#{clients.clientToCreate.name}" required="true"/>
        </h:panelGrid>
        <h:commandButton value="Create Client" action="#{clients.createClient}"/>
    </h:form>

    <h2>Existing Clients</h2>
    <h:dataTable value="#{clients.allClients}" var="client" border="1">
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{client.id}
        </h:column>
        <h:column>
            <f:facet name="header">Name</f:facet>
            #{client.name}
        </h:column>
        <h:column>
            <f:facet name="header">Trainers</f:facet>
            <h:link value="Manage Trainers" outcome="clientTrainers">
                <f:param name="clientId" value="#{client.id}"/>
            </h:link>
        </h:column>
    </h:dataTable>
    <br/>
    <h:link value="Back to Index" outcome="index"/>
</h:body>
</html>
