<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Gyms</title>
</h:head>
<h:body>
    <h1>Gyms</h1>

    <h:form>
        <h2>Create New Gym</h2>
        <h:panelGrid columns="2">
            <h:outputLabel value="Name:"/>
            <h:inputText value="#{gyms.gymToCreate.name}" required="true"/>
        </h:panelGrid>
        <h:commandButton value="Create Gym" action="#{gyms.createGym}"/>
    </h:form>

    <h2>Existing Gyms</h2>
    <h:dataTable value="#{gyms.allGyms}" var="gym" border="1">
        <h:column>
            <f:facet name="header">ID</f:facet>
            #{gym.id}
        </h:column>
        <h:column>
            <f:facet name="header">Name</f:facet>
            #{gym.name}
        </h:column>
        <h:column>
            <f:facet name="header">Trainers</f:facet>
            <h:link value="View Trainers" outcome="trainers">
                <f:param name="gymId" value="#{gym.id}"/>
            </h:link>
        </h:column>
    </h:dataTable>
    <br/>
    <h:link value="Back to Index" outcome="index"/>
</h:body>
</html>
